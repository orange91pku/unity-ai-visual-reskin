[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revisual-rag"
version = "0.4.0"
description = "Local-first Visual RAG catalog and retrieval engine for ReVisualReskin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
revisual-rag = "revisual_rag.cli:main"

[tool.setuptools.packages.find]
include = ["revisual_rag*"]

[tool.unittest]
start-directory = "tests"
