name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Python regression suite
        run: python -m unittest discover -s tests -v

      - name: Validate Unity package contracts
        shell: pwsh
        run: ./tools/validate-repository.ps1

      - name: Smoke-test CLI
        run: |
          python -m revisual_rag --help
          python -m revisual_rag propose --help
